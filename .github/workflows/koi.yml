# Copy into your profile repository as .github/workflows/koi.yml, then embed
# <img src="koi/koi.gif" width="256" alt="My koi"> in its README.md.
name: Koi

on:
  schedule:
    # Just after midnight UTC, so the koi shows the day that just ended.
    - cron: "20 0 * * *"
  workflow_dispatch:
  push:
    paths: [.github/workflows/koi.yml, scripts/render_pond.py, scripts/render_signal.py]

permissions:
  contents: write

concurrency: koi

jobs:
  koi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: yalongwastaken/git-koi@7305e9b1fadee6f43d3b4fa543a25d4cde79856e # v1.0.2
        with:
          body: white
          output-dir: koi
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Render the pond
        run: |
          python -m pip install 'numpy==2.4.3' 'Pillow==13.0.0'
          python scripts/render_pond.py
      - name: Refresh the public signal
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/render_signal.py
      - name: Commit the koi, pond and signal if changed
        shell: bash
        run: |
          git add koi/koi.gif koi/pond.gif assets/signal.png
          if git diff --cached --quiet; then
            echo "Profile assets are unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet --message "koi: draw the day's koi"
          git push --quiet
